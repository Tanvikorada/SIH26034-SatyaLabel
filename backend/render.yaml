databases:
  - name: satyalabel_db
    databaseName: satyalabel
    user: satyalabel_admin
    plan: free

services:
  - type: web
    name: satyalabel-backend
    env: node
    plan: free
    buildCommand: "apt-get update && apt-get install -y tesseract-ocr && npm install"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: satyalabel_db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        value: AIzaSyCVM9nKpQ6MHG-tDkZnuLlCPJPmQ1hnZdw
